<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="sketch" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g filter="url(#sketch)">
    <!-- Outer Box -->
    <rect x="160" y="160" width="180" height="180" rx="8" fill="#f8fafc" stroke="#8d96a3" stroke-width="3" />
    
    <!-- Mountains -->
    <path d="M 162 338 L 210 260 L 270 310 L 305 285 L 338 325 L 338 338 Z" fill="#d5dde6" stroke="#8d96a3" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Sun -->
    <circle cx="280" cy="220" r="18" fill="#d5dde6" stroke="#8d96a3" stroke-width="3" />
  </g>
</svg>
